{% extends "base.html" %}
{% block title %}Log Out — EgyCrowd{% endblock %}

{% block content %}
<section style="min-height: 70vh; display: flex; align-items: center; justify-content: center;">
    <div class="text-center" style="max-width: 400px;">
        <h2 class="mb-3">Log out of EgyCrowd?</h2>
        <p style="color: #888; margin-bottom: 24px;">You'll need to log in again to access your account.</p>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="auth-submit-btn">Log Out</button>
        </form>
        <a href="{% url 'homepage' %}" class="btn-pill btn-pill-outline w-100 text-center d-block mt-2">Cancel</a>
    </div>
</section>
{% endblock %}
